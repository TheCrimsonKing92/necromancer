<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Necromancer — a turn-based, narrative-driven RPG set in Maldirin."
    />
    <meta name="theme-color" content="#11100f" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Necromancer</title>
  </head>
  <body>
    <aside class="accessibility-bar" aria-label="Reading preferences">
      <button
        class="music-control"
        type="button"
        data-music-control
        data-music-state="off"
        aria-pressed="false"
        aria-label="Background music: off. Activate to turn it on."
      >
        <span class="music-control__glyph" aria-hidden="true">♪</span>
        <span class="music-control__status" data-music-status>Off</span>
      </button>
      <button
        class="text-scale-control"
        type="button"
        data-text-scale-control
        aria-label="Text size: Standard."
      >
        <span class="text-scale-control__glyph" aria-hidden="true">Aa</span>
      </button>
    </aside>
    <div id="app"></div>
    <noscript>Necromancer requires JavaScript to play.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
